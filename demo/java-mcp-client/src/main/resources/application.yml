server:
  port: 8090

# M3：编排层配置（可被命令行覆盖，如 --mcp.planner.model=qwen-plus）
mcp:
  planner:
    model: qwen-plus
    task-timeout-seconds: 300
    llm-timeout-seconds: 60
    tool-timeout-seconds: 45
  circuit:             # M5：熔断（连续失败 N 次打开，冷却后只放 1 个探测请求）
    failure-threshold: 3
    open-seconds: 30
    half-open-permits: 1
  trace:
    dir: E:/dsh_working/my_work/demo/logs/trace
  # 记忆层 v1（docs/04-memory-layer-v1.md）：SQLite 单文件 + 短期窗口 + 长期向量召回
  memory:
    enabled: true
    db-path: E:/dsh_working/my_work/demo/logs/memory/memory.db
    window:
      max-messages: 20          # A2：超过窗口只留最近 20 条
    recall:
      top-k: 5                  # 每次召回最多 5 条
      min-score: 0.35           # 余弦相似度下限，低于它不注入
      half-life-days: 30        # 时间衰减半衰期（越旧权重越低）
    embedding:                  # 2026-11-07 实测：/compatible-mode/v1/embeddings 可用
      enabled: true             # text-embedding-v3 默认 1024 维，dimensions=768 也实测通过
      model: text-embedding-v3
      dimensions: 1024          # 写进配置，不写死在代码里；与 RAG 共用
    extract:
      enabled: true
      default-confidence: 0.8
      episodic-ttl-days: 90

spring:
  profiles:
    active: local
  ai:
    openai:              # 规划型 Host：DashScope（阿里百炼）OpenAI 兼容接口
      # 注意：Spring AI 会自己拼 /v1/chat/completions，所以这里**不能**带 /v1
      #（Python 的 openai SDK 相反，base_url 要带 /v1）
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:}   # 从环境变量读取，不写进仓库
      chat:
        options:
          model: qwen-plus
          temperature: 0.3
      embedding:           # 记忆层/RAG 共用的 embedding（与上面同一套 base-url + key）
        options:
          model: text-embedding-v3   # embedding 模型名（与 mcp.memory.embedding.model 保持一致）
          dimensions: 1024           # 向量维度（实测 text-embedding-v3 默认 1024）
    mcp:
      client:            # 客户端配置：本 Java 应用作为 MCP Client，连接 Python 微服务
        enabled: true
        name: java-orchestrator
        version: 0.0.1
        request-timeout: 120s
        toolcallback:    # 把 MCP 工具转为 ChatClient 可用的 ToolCallback（M2 规划循环使用）
          enabled: true
        streamable-http: # 通过 Streamable HTTP 协议连接（Agent 集群的网络通信方式）
          connections:
            demo-tools:
              url: http://127.0.0.1:8001
            agent-worker:
              url: http://127.0.0.1:8002
            rag-server:      # RAG 知识库服务（demo/py-rag-server，端口 8003）
              url: http://127.0.0.1:8003

