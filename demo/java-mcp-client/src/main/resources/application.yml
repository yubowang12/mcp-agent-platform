server:
  port: 8090

# M3：编排层配置（可被命令行覆盖，如 --mcp.planner.model=qwen-plus）
mcp:
  planner:
    model: qwen-plus
    task-timeout-seconds: 300
    llm-timeout-seconds: 60
    tool-timeout-seconds: 45
  circuit:             # M5：熔断（连续失败 N 次打开，冷却后只放 1 个探测请求）
    failure-threshold: 3
    open-seconds: 30
    half-open-permits: 1
  trace:
    dir: E:/dsh_working/my_work/demo/logs/trace

spring:
  ai:
    openai:              # 规划型 Host：DashScope（阿里百炼）OpenAI 兼容接口
      # 注意：Spring AI 会自己拼 /v1/chat/completions，所以这里**不能**带 /v1
      #（Python 的 openai SDK 相反，base_url 要带 /v1）
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:}   # 从环境变量读取，不写进仓库
      chat:
        options:
          model: qwen-plus
          temperature: 0.3
    mcp:
      client:            # 客户端配置：本 Java 应用作为 MCP Client，连接 Python 微服务
        enabled: true
        name: java-orchestrator
        version: 0.0.1
        request-timeout: 120s
        toolcallback:    # 把 MCP 工具转为 ChatClient 可用的 ToolCallback（M2 规划循环使用）
          enabled: true
        streamable-http: # 通过 Streamable HTTP 协议连接（Agent 集群的网络通信方式）
          connections:
            demo-tools:
              url: http://127.0.0.1:8001
            agent-worker:
              url: http://127.0.0.1:8002
